name: Compilar APK con Flet

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Crear estructura de proyecto Flet
        run: |
          flet create --template app . || true

      - name: Compilar APK
        run: |
          flet build apk

      - name: Subir el archivo APK
        uses: actions/upload-artifact@v4
        with:
          name: tabata-app-apk
          path: build/apk/*.apk
